name: Publish verified Mokawa preview
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Mokawa Vue Windows x64 workflow run ID
        required: true
        type: string
      release_tag:
        description: Pre-release tag
        required: true
        default: v0.1.0-preview.3
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-mokawa-preview
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify successful Windows build provenance
        id: source
        shell: pwsh
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/${{ inputs.build_run_id }}" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Windows build evidence' }
          if ($run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/tauri-windows.yml' -or $run.head_branch -ne 'main') { throw 'The selected run is not a successful main-branch Mokawa Vue Windows build' }
          "sha=$($run.head_sha)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: Mokawa-Vue-Windows-x64-unsigned
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: validated
      - name: Package verified release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'validated/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Mokawa_*_x64-setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'Windows x64 installer is missing from the selected CI artifact' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $installer.FullName 'dist/Mokawa-0.1.0-x64-setup.exe'
          Copy-Item 'validated/dist/tauri-dependency-licenses.json' 'dist/dependency-licenses.json'
          Copy-Item 'validated/dist/tauri-frontend-licenses.json' 'dist/frontend-licenses.json'
          $assets = @('dist/Mokawa-0.1.0-x64-setup.exe','dist/dependency-licenses.json','dist/frontend-licenses.json')
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          $lines | Set-Content -Encoding ascii 'dist/SHA256SUMS.txt'
      - name: Upload and publish verified pre-release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+-preview\.\d+$') { throw 'Release tag must be a numbered preview tag' }
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish,assets 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0 -and $release) {
            if (!$release.isDraft -or $release.targetCommitish -ne $env:SOURCE_SHA -or $release.assets.Count -ne 0) { throw 'Existing release draft does not match the verified build; refusing to overwrite it' }
          } else {
            $notes = @'
          Mokawa 0.1.0 Preview 3 是面向 Windows 10/11 x64 的开发预览版，采用 Vue 3、Tauri 2 与 Rust。

          本版包含新的简体中文界面与浅/深主题、首页和文件管理布局、设置分类、任务中心筛选，以及 PikPak 个人访问令牌（PAT）连接入口。窗口拖动、双击最大化、最大化/还原、最小化和关闭均已在 Windows Runner 验收。

          **认证限制：** Mokawa 尚无 PikPak 官方桌面 OAuth 客户端注册。PAT 会在本机输入，只有根目录 API 验证成功后才保存到 Windows 凭据管理器；当前没有可用于本次发布的真实 PikPak 账号验证结果，所以不能保证 PAT 对所有账号或文件操作有效。浏览器授权仍关闭。请勿把此预览版视为已验证可登录的正式客户端。

          **Windows 验证：** Windows 2022 CI 完成前端/Rust/Tauri 检查、MSVC x64 安装包构建、静默安装、WebView2 主题与个性化设置持久化、窗口控制/拖动验收和卸载。只发布 Windows x64 NSIS 安装器，不提供未经验证的便携版。

          安装器和应用**未进行代码签名**。下载后可使用 `SHA256SUMS.txt` 校验。此版本尚未接入上传、移动/复制、分享、离线下载、完整回收站和媒体播放；下载暂停/续传也未验证。
          '@
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:SOURCE_SHA --title 'Mokawa 0.1.0 Preview 3' --notes $notes --draft --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the pre-release draft' }
          }
          gh release upload $env:RELEASE_TAG dist/Mokawa-0.1.0-x64-setup.exe dist/SHA256SUMS.txt dist/dependency-licenses.json dist/frontend-licenses.json --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed; draft remains unpublished' }
          $uploaded = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $uploaded.assets.Count -ne 4) { throw 'Incomplete release assets' }
          foreach ($asset in $uploaded.assets) {
            if ($asset.size -ne (Get-Item "dist/$($asset.name)").Length) { throw "Release asset size mismatch: $($asset.name)" }
          }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified pre-release' }
          $published = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish,assets | ConvertFrom-Json
          if ($published.isDraft -or $published.targetCommitish -ne $env:SOURCE_SHA -or $published.assets.Count -ne 4) { throw 'Published release verification failed' }
