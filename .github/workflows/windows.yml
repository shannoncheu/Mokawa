name: Windows x64
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-package:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install pinned Rust
        shell: pwsh
        run: rustup show
      - name: Format
        run: cargo fmt --check
      - name: Core and mock tests
        run: cargo test --locked --all-targets
      - name: Check native UI
        run: cargo check --locked --features desktop --all-targets
      - name: Lint
        run: cargo clippy --locked --features desktop --all-targets -- -D warnings
      - name: Build Windows x64 executables
        run: cargo build --locked --release --features desktop --bins
      - name: Verify executable metadata and system DLL imports
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = (Get-Item target/release/mokawa.exe).VersionInfo
          if ($version.ProductName -ne 'Mokawa') { throw 'Incorrect product metadata' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (!$dumpbin) { throw 'dumpbin was not found' }
          & $dumpbin /DEPENDENTS target/release/mokawa.exe | Set-Content dist/imports.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect PE imports' }
          if (Select-String -Path dist/imports.txt -Pattern 'VCRUNTIME[0-9]|MSVCP[0-9]' -Quiet) { throw 'Unexpected dynamic MSVC runtime dependency' }
      - name: Prepare dependency metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cargo metadata --locked --format-version 1 | Set-Content -Encoding utf8 dist/dependency-licenses.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer/mokawa.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify silent install
        shell: pwsh
        run: |
          $installer = Start-Process dist/Mokawa-0.1.0-x64-setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Install failed" }
          $root = "$env:LOCALAPPDATA\Programs\Mokawa"
          if (!(Test-Path "$root\mokawa.exe")) { throw "Executable missing" }
          if (!(Test-Path "$root\mokawa-auth.exe")) { throw "Auth helper missing" }
      - name: Try native window smoke scenarios
        continue-on-error: true
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Executable "$env:LOCALAPPDATA/Programs/Mokawa/mokawa.exe"
      - name: Verify silent uninstall
        if: always()
        shell: pwsh
        run: |
          $root = "$env:LOCALAPPDATA\Programs\Mokawa"
          if (Test-Path "$root\Uninstall.exe") {
            $uninstaller = Start-Process "$root\Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
            if ($uninstaller.ExitCode -ne 0) { throw "Uninstall failed" }
            if (Test-Path "$root\mokawa.exe") { throw "Uninstall left executable" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mokawa-windows-x64-unsigned
          if-no-files-found: warn
          path: |
            dist/Mokawa-0.1.0-x64-setup.exe
            dist/dependency-licenses.json
            dist/imports.txt
            dist/smoke-results.json
            dist/*.png
            target/release/mokawa.exe
            target/release/mokawa-auth.exe
