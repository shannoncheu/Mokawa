[package]
name = "mokawa-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
[dependencies]
mokawa = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = "0.7"
[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.12.4", default-features = false, features = ["wry", "compression", "common-controls-v6", "protocol-asset"] }
rfd = "0.17"
webbrowser = "1"
fs2 = "0.4"
tauri-plugin-single-instance = "=2.5.4"
[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }
[[bin]]
name = "mokawa"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
